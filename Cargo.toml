[workspace]
resolver = "3"
members = ["crates/*"]

# vst3-host con un arreglo propio (ver vendor/vst3-host/QUANTUM.md): abre las ventanas de los
# plugins que no dan su tamaño antes de colocarlas, como Kontakt.
[patch.crates-io]
vst3-host = { path = "vendor/vst3-host" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Binario de distribución sin información de depuración, pero con los nombres de las funciones
# para que los informes de fallos muestren dónde ocurrió el error.
[profile.release]
strip = "debuginfo"
