[workspace]
resolver = "3"
members = ["crates/*"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Binario de distribución sin información de depuración, pero con los nombres de las funciones
# para que los informes de fallos muestren dónde ocurrió el error.
[profile.release]
strip = "debuginfo"
