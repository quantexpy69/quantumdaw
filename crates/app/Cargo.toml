[package]
name = "quantum-daw"
version = "0.6.0"
edition = "2024"
license = "MPL-2.0"
authors = ["Ivan Cheaib <ivanchepy@gmail.com>"]
repository = "https://github.com/quantexpy69/quantumdaw"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.36.2", features = ["svg"] }
engine = { version = "0.6.0", path = "../engine" }
project = { version = "0.6.0", path = "../project" }
resvg = { version = "0.45.1", default-features = false }
rfd = "0.17.2"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Paquete .deb (Debian, Ubuntu, Mint…): cargo deb -p quantum-daw
[package.metadata.deb]
name = "quantum-daw"
maintainer = "Ivan Cheaib <ivanchepy@gmail.com>"
copyright = "2026, Ivan Cheaib"
extended-description = "Estación de audio digital moderna: pistas de audio y MIDI, mixer con automatización, plugins propios, editor de audio, piano roll con instrumentos reales gratuitos y video."
section = "sound"
priority = "optional"
depends = "libasound2 | libasound2t64, libc6 (>= 2.28)"
recommends = "ffmpeg, p7zip-full, curl, xz-utils"
suggests = "pipewire-bin"
assets = [
    ["target/release/quantum-daw", "usr/bin/", "755"],
    ["../../packaging/linux/quantum-daw.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/com.quantumdaw.QuantumDAW.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../assets/quantumlogo.svg", "usr/share/icons/hicolor/scalable/apps/quantum-daw.svg", "644"],
    ["../../LICENSE", "usr/share/doc/quantum-daw/", "644"],
]

# Paquete .rpm (Fedora, RHEL, CentOS Stream, Rocky, AlmaLinux, openSUSE): cargo generate-rpm -p crates/app
[package.metadata.generate-rpm]
name = "quantum-daw"
summary = "Estación de audio digital moderna escrita en Rust"
url = "https://www.quantumdaw.com"
assets = [
    { source = "target/release/quantum-daw", dest = "/usr/bin/quantum-daw", mode = "755" },
    { source = "../../packaging/linux/quantum-daw.desktop", dest = "/usr/share/applications/quantum-daw.desktop", mode = "644" },
    { source = "../../packaging/linux/com.quantumdaw.QuantumDAW.metainfo.xml", dest = "/usr/share/metainfo/com.quantumdaw.QuantumDAW.metainfo.xml", mode = "644" },
    { source = "../../assets/quantumlogo.svg", dest = "/usr/share/icons/hicolor/scalable/apps/quantum-daw.svg", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/quantum-daw/LICENSE", mode = "644", doc = true },
]
# Dependencias declaradas a mano (la detección automática genera requisitos de glibc que dnf no acepta).
auto-req = "no"
[package.metadata.generate-rpm.requires]
glibc = ">= 2.28"
alsa-lib = "*"
[package.metadata.generate-rpm.recommends]
ffmpeg = "*"
p7zip = "*"
curl = "*"
