[package]
name = "project"
version = "0.7.0"
edition = "2024"
license = "MPL-2.0"
authors = ["Ivan Cheaib <ivanchepy@gmail.com>"]
repository = "https://github.com/quantexpy69/quantumdaw"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
flacenc = "0.5.1"
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
vorbis_rs = "0.5.6"

# LAME se compila con autotools: no disponible con MSVC (en Windows el MP3 usa ffmpeg).
[target.'cfg(not(windows))'.dependencies]
mp3lame-encoder = "0.2.5"
