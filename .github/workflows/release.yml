# Al subir una etiqueta vX.Y.Z se compila Quantum DAW para Linux, Windows y macOS y se publica el
# release con sus notas y todos los paquetes. También se puede lanzar a mano para una etiqueta.
name: Publicar versión

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta a publicar (por ejemplo v0.7.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Linux: compilado contra glibc 2.28 (AlmaLinux 8) → .deb, .rpm, AppImage, .tar.gz y PKGBUILD.
  linux:
    runs-on: ubuntu-latest
    container: almalinux:8
    steps:
      - name: Herramientas básicas
        run: dnf -y -q install git tar
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Compilar y empaquetar
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          CACHE="$HOME/cache" packaging/build.sh --dentro
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/quantum-daw-linux-x86_64.tar.gz
            dist/quantum-daw-amd64.deb
            dist/quantum-daw-x86_64.rpm
            dist/quantum-daw-x86_64.AppImage
            dist/PKGBUILD

  # Windows 10 y 11 (64 bits): instalador y versión portable.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Compilar
        run: cargo build --release --locked -p quantum-daw
      - name: Instalador (Inno Setup) y versión portable
        shell: pwsh
        run: |
          $version = (Select-String -Path crates/app/Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DVersion=$version" "/DBinario=$PWD\target\release\quantum-daw.exe" packaging\windows\quantum-daw.iss
          New-Item -ItemType Directory -Force "portable\Quantum DAW" | Out-Null
          Copy-Item target\release\quantum-daw.exe, LICENSE "portable\Quantum DAW\"
          Compress-Archive -Path "portable\Quantum DAW" -DestinationPath dist\quantum-daw-windows-x64.zip
          & target\release\quantum-daw.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/quantum-daw-windows-x64-setup.exe
            dist/quantum-daw-windows-x64.zip

  # macOS 11 Big Sur o posterior: aplicación universal (Intel y Apple Silicon) en un .dmg.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Compilar y empaquetar
        run: packaging/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/quantum-daw-macos-universal.dmg

  publicar:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sumas de verificación y notas
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          packaging/notas.sh "$TAG" > notas.md
      - name: Publicar el release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Quantum DAW ${{ env.TAG }}
          body_path: notas.md
          make_latest: true
          files: dist/*
