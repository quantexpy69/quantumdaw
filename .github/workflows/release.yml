# Al subir una etiqueta vX.Y.Z se compila Quantum DAW para Linux, Windows y macOS y se publica el
# release con sus notas y todos los paquetes. También se puede lanzar a mano para una etiqueta.
name: Publicar versión

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta a publicar (por ejemplo v0.7.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Clave de despliegue (solo lectura) del repositorio privado de los plugins QUANTUM Pro.
  # Sin ella se publica igual, pero sin los plugins Pro.
  PRO_KEY: ${{ secrets.QUANTUM_PRO_KEY }}

jobs:
  # Linux: compilado contra glibc 2.28 (AlmaLinux 8) → .deb, .rpm y AppImage.
  linux:
    runs-on: ubuntu-latest
    container: almalinux:8
    # Si algo se cuelga (por ejemplo un mirror de AlmaLinux muy lento) falla en vez de esperar 6 horas.
    timeout-minutes: 40
    steps:
      - name: Herramientas básicas
        run: |
          # El mirror más rápido y descargas en paralelo: con los mirrors lentos este paso llegó a 28 min.
          printf 'fastestmirror=True\nmax_parallel_downloads=10\ninstall_weak_deps=False\n' >> /etc/dnf/dnf.conf
          dnf -y -q install git tar openssh-clients
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Plugins QUANTUM Pro (repositorio privado)
        if: env.PRO_KEY != ''
        uses: actions/checkout@v4
        with:
          repository: quantexpy69/quantum-pro
          ssh-key: ${{ secrets.QUANTUM_PRO_KEY }}
          path: pro
      # Rust, cargo-deb, cargo-generate-rpm, lilv y lo ya compilado se guardan entre releases: así no
      # se vuelven a instalar y compilar desde cero cada vez.
      - name: Caché de herramientas y compilación
        uses: actions/cache@v4
        with:
          path: .cache-linux
          key: linux-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-
      - name: Compilar y empaquetar
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          CACHE="$PWD/.cache-linux" packaging/build.sh --dentro
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/quantum-daw-amd64.deb
            dist/quantum-daw-x86_64.rpm
            dist/quantum-daw-x86_64.AppImage

  # Windows 10 y 11 (64 bits): instalador y versión portable.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Plugins QUANTUM Pro (repositorio privado)
        if: env.PRO_KEY != ''
        uses: actions/checkout@v4
        with:
          repository: quantexpy69/quantum-pro
          ssh-key: ${{ secrets.QUANTUM_PRO_KEY }}
          path: pro
      - uses: dtolnay/rust-toolchain@stable
      - name: Compilar
        shell: pwsh
        run: |
          $pro = if (Test-Path pro/mod.rs) { @('--features', 'pro') } else { @() }
          cargo build --release --locked -p quantum-daw @pro
      - name: Instalador (Inno Setup) y versión portable
        shell: pwsh
        run: |
          $version = (Select-String -Path crates/app/Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DVersion=$version" "/DBinario=$PWD\target\release\quantum-daw.exe" packaging\windows\quantum-daw.iss
          New-Item -ItemType Directory -Force "portable\Quantum DAW" | Out-Null
          Copy-Item target\release\quantum-daw.exe, LICENSE "portable\Quantum DAW\"
          Compress-Archive -Path "portable\Quantum DAW" -DestinationPath dist\quantum-daw-windows-x64.zip
          & target\release\quantum-daw.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/quantum-daw-windows-x64-setup.exe
            dist/quantum-daw-windows-x64.zip

  # macOS 11 Big Sur o posterior: aplicación universal (Intel y Apple Silicon) en un .dmg.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Plugins QUANTUM Pro (repositorio privado)
        if: env.PRO_KEY != ''
        uses: actions/checkout@v4
        with:
          repository: quantexpy69/quantum-pro
          ssh-key: ${{ secrets.QUANTUM_PRO_KEY }}
          path: pro
      - uses: dtolnay/rust-toolchain@stable
      - name: Compilar y empaquetar
        run: packaging/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/quantum-daw-macos-universal.dmg

  publicar:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sumas de verificación y notas
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          packaging/notas.sh "$TAG" > notas.md
      - name: Publicar el release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Quantum DAW ${{ env.TAG }}
          body_path: notas.md
          make_latest: true
          files: dist/*
